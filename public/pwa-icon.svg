<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#06321f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect with safe padding for maskable support -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="8" opacity="0.3" />
  
  <!-- Central Paw Print in Gold -->
  <g transform="translate(256, 275) scale(1.15)">
    <!-- Main Paw Pad -->
    <path d="M 0 5 C -45 5 -75 35 -65 80 C -55 125 -10 135 0 135 C 10 135 55 125 65 80 C 75 35 45 5 0 5 Z" fill="url(#goldGrad)" />
    <!-- 4 Toe Pads -->
    <ellipse cx="-55" cy="-25" rx="22" ry="32" transform="rotate(-25, -55, -25)" fill="url(#goldGrad)" />
    <ellipse cx="-20" cy="-60" rx="22" ry="34" transform="rotate(-8, -20, -60)" fill="url(#goldGrad)" />
    <ellipse cx="20" cy="-60" rx="22" ry="34" transform="rotate(8, 20, -60)" fill="url(#goldGrad)" />
    <ellipse cx="55" cy="-25" rx="22" ry="32" transform="rotate(25, 55, -25)" fill="url(#goldGrad)" />
  </g>
  
  <!-- Little heart/star badge at top -->
  <circle cx="256" cy="95" r="14" fill="#34d399" />
  <path d="M 256 87 L 259 93 L 265 94 L 261 98 L 262 104 L 256 101 L 250 104 L 251 98 L 247 94 L 253 93 Z" fill="#ffffff" />
</svg>
